---
apiVersion: "kubevirt.io/v1"
kind: FlavorMetadata
metadata:
  name: general
spec:
  name: general
  description: Balanced vCPU and memory for a wide range of workloads.
  type: instance_type
  families:
    - name: m1
      description: Standard general purpose with a fixed vCPU-to-memory ratio.
    - name: t1
      description: Small general purpose for light or bursty workloads.

---
apiVersion: "kubevirt.io/v1"
kind: FlavorMetadata
metadata:
  name: compute
spec:
  name: compute
  description: High vCPU-to-memory ratio for compute-bound workloads.
  type: instance_type
  families:
    - name: c1
      description: Compute optimized with more vCPUs per GiB of memory.

---
apiVersion: "kubevirt.io/v1"
kind: FlavorMetadata
metadata:
  name: memory
spec:
  name: memory
  description: High memory-to-vCPU ratio for memory-intensive workloads.
  type: instance_type
  families:
    - name: r1
      description: Memory optimized with more GiB of memory per vCPU.

---
apiVersion: "kubevirt.io/v1"
kind: FlavorMetadata
metadata:
  name: storage
spec:
  name: storage
  description: Large local ephemeral disk for storage-intensive workloads.
  type: instance_type
  families:
    - name: i1
      description: Storage optimized with a large local ephemeral disk.

---
apiVersion: "kubevirt.io/v1"
kind: FlavorMetadata
metadata:
  name: accelerated
spec:
  name: accelerated
  description: GPU or other hardware accelerators attached.
  type: instance_type
  families:
    - name: g1
      description: GPU accelerated for graphics and inference workloads.
    - name: p1
      description: GPU accelerated for training and HPC workloads.
