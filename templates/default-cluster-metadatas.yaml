    DRA Driver for NVIDIA GPUs (chart 0.4.1) — allocate GPUs through Dynamic Resource
    Allocation so one claim can pin a GPU and its fabric NIC to the same PCIe root.
    Replaces the GPU operator device plugin: nvidia.com/gpu is removed from the nodes and
    GPU workloads must move to ResourceClaims, so install only on clusters built for it.
  name: gpu-dra
  type: addon
  vendor: Kubernetes SIGs
  version: "0.4.1"

