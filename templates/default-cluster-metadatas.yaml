---
apiVersion: kubevirt.io/v1
kind: ClusterMetadata
metadata:
  labels:
    addons.petasus.io/nvidia-gpu-operator: "580.178.04"
  name: nvidia-gpu-operator-580.178.04
spec:
  compatibility:
    - ubuntu-2404
    - rocky-9
  description: >-
    NVIDIA GPU Operator (driver 580.178.04) with the DRA Driver for NVIDIA GPUs. GPUs are
    allocated through Dynamic Resource Allocation: a pod requests one with nvidia.com/gpu,
    as with the device plugin, or with a ResourceClaim, which can also pin the GPU and its
    fabric NIC to the same PCIe root. The device plugin is not installed, so the nodes
    report no nvidia.com/gpu capacity. Requires Kubernetes 1.36 or later.
  name: nvidia-gpu-operator
  type: addon
  vendor: NVIDIA
  version: "580.178.04"

